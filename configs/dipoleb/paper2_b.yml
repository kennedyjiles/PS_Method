# ===================================================================
# Paper 2 — 100 MeV electron, 60° pitch, 5 R_E
# ===================================================================

particle: electron
phi_deg: 90.0

solvers:
  rk4: true
  rk45: true
  rkg: true

gyroperiods: 1e5

# These are informational — the step overrides take precedence
steps_per_gyro:
  ps: 10.0
  rk4: 1570.8
  rkg: 100

round_decimals: 2         # decimal places for step size rounding


plotting:
  titles: true
  n_gyro: 75

rtol_rk45: 1.0e-13         # RK45 relative tolerance
atol_rk45: 1.0e-15        # RK45 absolute tolerance

window_time: 11.6