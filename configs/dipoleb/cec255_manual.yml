# ===================================================================
# cec255_manual.yml — manual replot of the 20-year PS VDS (cec255)
# ===================================================================
# Points at the stitched VDS on the external drive and regenerates
# plot data / figures. Only PS data exists in this file, so only the
# PS curve is enabled below.
#
# Run with:
#   python run.py configs/dipoleb/cec255_manual.yml --replot
# ===================================================================

base_config: "none"
manual_h5_path: "/Volumes/Jiles_thesi/data/dipoleb/20yearparticle/_rawdata/cec255_full.h5"


# ===================================================================
# === Fields that MATTER in manual mode — edit these ===============
# ===================================================================

# This VDS only holds PS data — leave the others off.
solvers:
  ps: true
  rk4: false
  rk45: false
  rkg: false
  adaptive: false

plotting:
  titles: false           # show plot titles
  full_plot: false         # all diagnostic plots vs paper plots only
  slice_mode: last        # "first" or "last" — which window for slice plots
  gyro_window: last       # "first" or "last" — window for detailed view
  n_gyro: 75              # gyroperiods in the slice window
  invariants_only: true

# Time window for slice plots (normalized units)
window_time: 11.6

# Output destination — null => data/dipoleb/<yml-stem>/<h5-stem>/...
# Set an absolute path here (e.g. on the external drive) if you'd
# rather the figures land next to the data.
output_root: null

# Plot cosmetics
plot_boundary_pad: 1.1    # padding multiplier for trajectory boundaries

# Drift detection sensitivity (used by post-processing on the cached data)
user_min_phase: 0.1

# Bounce/drift detection (used by post-processing on the cached data)
bounce_drift:
  velocity_epsilon_scale: 1.0e-14
  min_gap_steps: 3
  gap_gyro_fraction: 0.5

# External h5 overlays (compare against another run)
use_external_h5:
  ps:   false
  rk4:  false
  rk45: false
  rkg:  false

external_h5:
  root: null
  ps:   null
  rk4:  null
  rk45: null
  rkg:  null


# ===================================================================
# === Fields IGNORED in manual mode — keys required, values dead ===
# ===================================================================
# Overwritten from the h5's summary_json, peeked from its dtype, or
# never read because no solver runs in manual mode. Leave as-is.

# --- Identity (overwritten from h5) ---
particle: proton
energy_eV: 1.0e1
pitch_deg: 99.0
phi_deg: 99.0
x_initial: 0.0
y_initial: 0.0
z_initial: 0.0
gyroperiods: 100
use_gyroradius_L_correction: false

# --- Float precision (peeked from h5's saved dtype) ---
use_float128: false

# --- Bookkeeping (forced or never read in manual mode) ---
read_data: true
write_data: true

# --- Atmospheric flag (the h5 already records hit_atmosphere/hit_atm_*) ---
r_atmosphere: 1.0

# --- PS / RK / RKG solver settings (overwritten from h5; no fresh solve) ---
ps_decimate: 1
ps_order: 40
ps_chunk_steps: 10000
rtol_rk45: 1.0e-8
atol_rk45: 1.0e-10
cache_velocity_rtol: 0.005

steps_per_gyro:
  ps: 65
  rk4: 65
  rkg: 65

step_overrides:
  ps: null
  rk4: null
  rkg: null

round_decimals: 1

# --- Adaptive PS settings (no fresh solve in manual mode) ---
ps_adaptive:
  order_low: 50
  order_high: 300
  grow_factor: 1.5
  shrink_factor: 0.5
  steps_per_local_gyro: 200
  min_fast_path_N: 100

# --- Dragt conservation monitor (no fresh solve in manual mode) ---
dragt_monitor_rtol: 1.0e-4
