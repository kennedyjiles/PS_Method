# ===================================================================
# Paper 3 — paper1 physics with mismatched step sizes
#           PS takes huge steps, RK4 takes tiny steps
#           RKG intermediate. RK45 at looser tol.
# ===================================================================

energy_eV: 100.0e3
pitch_deg: 30.0

solvers:
  rk4: true
  rkg: true
  rk45: true

gyroperiods: 1e5

round_decimals: 2        

steps_per_gyro:
  ps: 14.5
  rk4: 1570.8
  rkg: 100

rtol_rk45: 1.0e-13        # RK45 relative tolerance
atol_rk45: 1.0e-15        # RK45 absolute tolerance

# Original expression: 6206.0 * 4 / 0.00033464094804535314 (tau)
norm_time_override: 74180999.50110008

window_time: 6209.0


