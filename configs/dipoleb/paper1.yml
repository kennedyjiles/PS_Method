energy_eV: 100.0e3
pitch_deg: 30.0

solvers:
  rk4: true
  rk45: true
  rkg: true

# Integration defined by total steps rather than gyroperiods.
# 1e7 steps × ps_step gives norm_time; gyroperiods is derived.
gyroperiods: null         # null suppresses base.yml's value so total_steps drives norm_time
total_steps: 1.0e7

window_time: 6209.0

