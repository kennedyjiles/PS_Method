# ===================================================================
# Default configuration for dipoleb simulations
# ===================================================================
# These are the baseline values. A run config only needs to specify
# the values it wants to CHANGE — everything else falls back here.
# Do NOT edit this file directly. Copy it to a new .yml and override
# only the parameters you need.
# ===================================================================


# =====================
# === Run Settings  ===
# =====================

# --- Particle ---
particle: proton          # "proton" or "electron"
energy_eV: 100.0e6        # kinetic energy in eV
pitch_deg: 60.0           # pitch angle (degrees)
phi_deg: 90.0             # gyrophase angle (degrees)
x_initial: 5.0            # initial x position (L-shell, in R_E)
y_initial: 0.0            # initial y position (R_E), usually 0
z_initial: 0.0            # initial z position (R_E), usually 0

# --- Precision ---
use_float128: false        # true = use np.float128 (disables numba JIT and RKG)

# --- Integration ---
gyroperiods: 450          # number of gyroperiods to simulate
use_gyroradius_L_correction: false  # Uses gyroradius-corrected L_eff for T_gyro computation
                                    # (more accurate step sizing). Launch position (x_initial)
                                    # is unchanged. Only matters when gyroradius is a significant
                                    # fraction of x_initial (e.g. 210 MeV protons at L~3).
                                    # Safe to leave false for low-energy particles or electrons.

# --- Solvers ---
solvers:
  ps: true
  rk4: false
  rk45: false
  rkg: false
  adaptive: false         # true = adaptive PS stepping

# --- Plotting ---
plotting:
  titles: false           # show plot titles
  full_plot: true         # true = all diagnostic plots, false = paper plots only
  slice_mode: last        # "first" or "last" — which gyro window to slice
  gyro_window: last       # "first" or "last" — which gyro window for detailed view
  n_gyro: 150              # number of gyroperiods in slice window

window_time: 300.0         # time window for slice plots (normalized units)

# --- Output ---
# By default, output goes to data/dipoleb/<config-name>/.
# Set output_root to prepend a path:
#   output_root: "thesis/chapter3"  → thesis/chapter3/data/dipoleb/<config-name>/
# Leave null for the default layout.
output_root: null
read_data: true                # scan for cached runs and load from disk

# --- Special modes (leave null for normal runs) ---
manual_h5_path: null      # path to specific h5 file for manual loading


# ===================================================================
# === Advanced Settings (most users will not need to touch these) ===
# ===================================================================

# --- PS Settings ---
ps_decimate: 1            # save every Nth PS step (1 = save all)
ps_order: 40              # max power series order (system will truncate)
ps_chunk_steps: 10000     # number of PS steps per h5 streaming chunk

# --- RK45 Tolerances ---
rtol_rk45: 1.0e-8         # RK45 relative tolerance
atol_rk45: 1.0e-10        # RK45 absolute tolerance

# --- System Tolerances ---
cache_velocity_rtol: 0.005   # relative tolerance for cache velocity mismatch warning
plot_boundary_pad: 1.1       # padding multiplier for trajectory plot boundaries

# --- Drift Detection ---
user_min_phase: 0.001       # minimum radians to extrapolate drift from

# --- Steps per gyroperiod (used to compute step sizes from T_gyro) ---
# Set to null to use defaults (65 for all). Override individually as needed.
steps_per_gyro:
  ps: 65
  rk4: 65
  rkg: 65

# --- Step size overrides (optional) ---
# If set, these OVERRIDE the computed step sizes from steps_per_gyro.
# Leave as null to let the code compute them.
step_overrides:
  ps: null
  rk4: null
  rkg: null

# --- Step rounding ---
round_decimals: 1         # decimal places for step size rounding

# --- Adaptive PS Settings ---
# Only used when solvers.adaptive = true. Safe to ignore for fixed-step runs.
ps_adaptive:
  order_low: 50             # minimum PS order for adaptive stepping
  order_high: 300           # maximum PS order for adaptive stepping
  grow_factor: 1.5          # step-size growth multiplier on success
  shrink_factor: 0.5        # step-size shrink multiplier on failure
  steps_per_local_gyro: 200 # target steps per local gyroperiod
  min_fast_path_N: 100      # minimum steps before fast-path kicks in

# --- Dragt Monitor ---
dragt_monitor_rtol: 1.0e-4  # relative tolerance for Dragt conservation monitor

# --- Atmospheric impact flag ---
# Particle is marked as atmosphere-impacted when r < r_atmosphere (in R_E).
# 1.0 = Earth's surface; 1.0157 ≈ 100 km altitude.
r_atmosphere: 1.0

# --- Bounce/Drift Detection ---
# Controls how mirror-bounce crossings and azimuthal drift are detected.
# Unlikely to need changing unless working with exotic orbits.
bounce_drift:
  velocity_epsilon_scale: 1.0e-14  # multiplied by v_tau to get velocity noise floor
  min_gap_steps: 3                 # minimum steps between crossings
  gap_gyro_fraction: 0.5           # fraction of T_gyro/ps_step for min gap fallback

# --- External H5 files (for energy comparison across solvers) ---
# Schema is keyed by SOLVER (one external h5 per solver type) — used to
# compare PS / RK4 / RK45 / RKG runs against each other. (Constb/hyperb
# use a different schema — slot a/b — because they compare PS orders.)
# Set root once; file paths are joined with root unless already absolute.
# Set use_external_h5 to true AND provide the path to enable comparison.
# Having a path alone does NOT enable it — the toggle must be explicit.
use_external_h5:
  ps:   false
  rk4:  false
  rk45: false
  rkg:  false

external_h5:
  root: null
  ps:   null
  rk4:  null
  rk45: null
  rkg:  null
