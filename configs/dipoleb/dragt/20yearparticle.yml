# ===================================================================
# Dragt — high-energy proton with relativistic L_eff
# (energy_eV / pitch_deg / particle inherited from base.yml)
# ===================================================================

pitch_deg: 30.0
energy_eV: 400.0e6       
gyroperiods: 2.7e10
use_gyroradius_L_correction: false
ps_segment_gyroperiods: 1e7   # gyroperiods per segment (0 = no segmentation)
ps_segment_offload: true      # resume from the highest LOCAL segment (earlier ones
                              # offloaded to the drive); skip the local VDS stitch
data_only: true

ps_decimate: 5            # save every Nth PS step (1 = save all)

ps_order: 100   

# # output_root: /Volumes/Extreme SSD
# output_root: /Volumes/Jiles_thesi
# read_data: true                # scan for cached runs and load from disk

plotting:
  titles: true
  slice_mode: last
  gyro_window: last
  n_gyro: 50

window_time: 4.0
