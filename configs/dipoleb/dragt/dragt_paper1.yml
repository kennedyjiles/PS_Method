# ===================================================================
# Dragt — high-energy proton with relativistic L_eff
# (energy_eV / pitch_deg / particle inherited from base.yml)
# ===================================================================

pitch_deg: 59.843930215243454
phi_deg: -90.0
x_initial: 3.21
energy_eV: 110.56110923480789e6
# gyroperiods: 1.45e2 # for the surface of section showing stable trapped
# gyroperiods: 6.225 # for the meridian slice comparing to paper
gyroperiods: 33 # for the surfance of section comaring to paper
use_gyroradius_L_correction: false
ps_segment_gyroperiods: 0   # gyroperiods per segment (0 = no segmentation)


solvers:
  adaptive: false

plotting:
  titles: false
  slice_mode: last
  gyro_window: last
  n_gyro: 175

window_time: 5.0

ps_order: 301   # just above adaptive order_high (300); higher only wastes

steps_per_gyro:
  ps: 65            
ps_adaptive:
  order_low: 20     
  order_high: 300   
  grow_factor: 1.5  
  shrink_factor: 0.5 
  steps_per_local_gyro: 20   
  min_fast_path_N: 20        