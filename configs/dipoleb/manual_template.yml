# ===================================================================
# manual_template.yml — Template for hand-written manual h5 loads
# ===================================================================
# Copy this file (e.g. to data/dipoleb/<run>/manual.yml or anywhere
# convenient), point manual_h5_path at the h5 you want to replot,
# and edit the plotting / output / slice fields as needed.
#
# How manual mode works:
#   1. The yml below is loaded with base_config: "none" — nothing is
#      merged in from base.yml. Every field the code reads must be
#      present in this file.
#   2. dipoleb.py opens the h5 at manual_h5_path and OVERWRITES the
#      identity + solver-config fields from its summary_json:
#        particle, energy_eV, pitch_deg, phi_deg, x/y/z_initial,
#        gyroperiods, norm_time, B_0, mass_si, T_gyro, ps_step,
#        steps_ps, ps_decimate, ordercap, max_ps, E0, mu0,
#        rk*_step, steps_per_gyro, etc.
#      So values you set for those here are IGNORED. They're listed
#      below for completeness but marked as such.
#   3. Everything else (plotting, slice, output, external overlays)
#      comes from this yml. Tweak as needed for the trimmed/replotted
#      view you want.
#
# Run with:
#   python run.py path/to/this.yml
# (Paths under data/ auto-trigger replot mode. Otherwise add --replot.)
# ===================================================================


# --- Self-contained: do NOT merge with base.yml ---
base_config: "none"

# --- Pointer to the cached h5 file ---
# Relative paths are tried yml-relative first, then cwd-relative.
manual_h5_path: "REPLACE_WITH_PATH_TO.h5"

# ===================================================================
# === Fields below MATTER — edit to control the replot ============
# ===================================================================

# --- Which solver curves to include in plots ---
# Set to false to drop a method from comparison plots even if the
# h5 has its data. (Adaptive is irrelevant in replot mode.)
solvers:
  ps: true
  rk4: true
  rk45: true
  rkg: true
  adaptive: false

# --- Plotting controls ---
plotting:
  titles: false           # show plot titles
  full_plot: true         # all diagnostic plots vs paper plots only
  slice_mode: last        # "first" or "last" — which window for slice plots
  gyro_window: last       # "first" or "last" — window for detailed view
  n_gyro: 75              # gyroperiods in the slice window
                          # IMPORTANT: for trimmed files, n_gyro must be
                          # smaller than the trimmed file's gyroperiods
                          # or the slice will be empty.

# Time window for slice plots (normalized units)
window_time: 11.6

# --- Output ---
# Output goes to data/dipoleb/<yml-stem>/. Set output_root to prepend.
output_root: null
read_data: true           # always true in manual mode

# --- Plot cosmetics ---
plot_boundary_pad: 1.1    # padding multiplier for trajectory boundaries

# --- Drift detection (used by post-processing) ---
user_min_phase: 0.1

# --- Atmospheric impact threshold (R_E) ---
# 1.0 = surface; 1.0157 ≈ 100 km altitude. Used by atmospheric overlay.
r_atmosphere: 1.0

# --- Bounce/drift detection ---
bounce_drift:
  velocity_epsilon_scale: 1.0e-14
  min_gap_steps: 3
  gap_gyro_fraction: 0.5

# --- External h5 overlays (compare against another run) ---
use_external_h5:
  ps:   false
  rk4:  false
  rk45: false
  rkg:  false

external_h5:
  root: null
  ps:   null
  rk4:  null
  rk45: null
  rkg:  null


# ===================================================================
# === Advanced — values below are mostly overridden by h5 but the ==
# === keys must exist for the code to read them without error. =====
# ===================================================================
ps_decimate: 1
ps_order: 40
ps_chunk_steps: 10000
rtol_rk45: 1.0e-8
atol_rk45: 1.0e-10
cache_velocity_rtol: 0.005

steps_per_gyro:
  ps: 65
  rk4: 65
  rkg: 65

step_overrides:
  ps: null
  rk4: null
  rkg: null

round_decimals: 1

ps_adaptive:
  order_low: 50
  order_high: 300
  grow_factor: 1.5
  shrink_factor: 0.5
  steps_per_local_gyro: 200
  min_fast_path_N: 100

dragt_monitor_rtol: 1.0e-4

# ===================================================================
# === Fields below are IGNORED in manual mode (h5 provides them) ===
# Listed only because the code reads the keys; values don't matter.
# ===================================================================
particle: proton
energy_eV: 1.0e1
pitch_deg: 99.0
phi_deg: 99.0
x_initial: 0.0
y_initial: 0.0
z_initial: 0.0
gyroperiods: 100
use_float128: false
use_gyroradius_L_correction: false