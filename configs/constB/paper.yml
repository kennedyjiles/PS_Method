# ===================================================================
# Paper run — 100 eV electron, 100k gyroperiods
# ===================================================================
# Original step sizes: rk4_step = ps_step = 0.063
# Reproduced via: steps_per_gyro = 100, round_decimals = 3
#   → round(2π/100, 3) = round(0.062832, 3) = 0.063 ✓
# ===================================================================

particle: electron
energy_eV: 100
pitch_deg: 45.0
phi_deg: 45.0
Bfield_si: [0, 0, 0.01]
gyroperiods: 1.0e5

solvers:
  ps: true
  rk4: true
  rk45: true
  analytical: true

plotting:
  titles: false
  full_plot: true
  gyro_plot_slice: 1.5

read_data: true
write_data: true

# --- External H5 (for multi-precision comparison) ---
use_external_h5: false
use_external_h5b: false
external_h5: "outputs/outputs_rawdata/run_29620be4f429e0cf.h5"
external_h5b: "outputs/outputs_rawdata/run_344c6be65eafa517.h5"
external_h5_ps_order: 19
external_h5b_ps_order: 10
