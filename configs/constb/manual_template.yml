# ===================================================================
# manual_template.yml — Template for hand-written manual h5 loads
# ===================================================================
# Copy this file (e.g. to data/constb/<run>/manual.yml or anywhere
# convenient), point manual_h5_path at the h5 you want to replot,
# and edit the plotting / output fields as needed.
#
# How manual mode works:
#   1. The yml below is loaded with base_config: "none" — nothing is
#      merged from base.yml. Every field the code reads must exist here.
#   2. constb.py opens the h5 at manual_h5_path and OVERWRITES the
#      identity / solver-config fields from its params_json:
#        particle, energy_eV, pitch_deg, phi_deg, x/y/z_initial,
#        Bfield_si (magnitude only — direction is lost in cache),
#        norm_time → gyroperiods, ps_step / rk4_step → step_overrides,
#        ps_order, rtol_rk45, atol_rk45.
#      So values you set for those here are IGNORED. They're listed
#      below for completeness but marked as such.
#   3. Everything else (plotting, solvers toggles, output, external
#      overlays) comes from this yml. Tweak as needed.
#
# Run with:
#   python run.py path/to/this.yml
# (Paths under data/ auto-trigger replot mode. Otherwise add --replot.)
# ===================================================================


base_config: "none"
manual_h5_path: "REPLACE_WITH_PATH_TO.h5"


# === Fields below are IGNORED in manual mode (h5 provides them) ===
particle: proton
energy_eV: 100
pitch_deg: 45.0
phi_deg: 45.0
x_initial: 0.0
y_initial: 0.0
z_initial: 0.0
Bfield_si: [0, 0, 0.01]
gyroperiods: 10.0
use_float128: false


# === Fields below MATTER — edit to control the replot ============

# Which solver curves to include in plots. Set to false to drop a method
# from comparison plots even if the h5 has its data.
solvers:
  ps: true
  rk4: true
  rk45: true
  analytical: true   # analytical curve recomputed at runtime — needs identity, which the h5 provides

plotting:
  titles: true
  full_plot: false       # true = all diagnostic plots, false = paper plots only
  gyro_plot_slice: 1.5   # gyroperiods to slice for visual inspection

output_root: null
read_data: true
write_data: true


# === Advanced — keys must exist; values mostly overridden by h5 ===
ps_order: 40
rtol_rk45: 1.0e-8
atol_rk45: 1.0e-10

steps_per_gyro:
  ps: 100
  rk4: 100
step_overrides:
  ps: null
  rk4: null
round_decimals: 3

external_h5:
  root: null
  a:
    enabled: false
    file: null
    ps_order: null
  b:
    enabled: false
    file: null
    ps_order: null
