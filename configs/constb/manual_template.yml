# ===================================================================
# manual_template.yml — Template for hand-written manual h5 loads
# ===================================================================
# Copy this file (e.g. to data/constb/<run>/manual.yml or anywhere
# convenient), point manual_h5_path at the h5 you want to replot,
# and edit the plotting / output fields as needed.
#
# How manual mode works:
#   1. The yml below is loaded with base_config: "none" — nothing is
#      merged from base.yml. Every field the code reads must exist
#      here, even if its value will be ignored.
#   2. constb.py opens the h5 at manual_h5_path and OVERWRITES the
#      identity / solver-config fields (energy, pitch, position, B,
#      step sizes, ps_order, rk45 tolerances, etc.) from params_json.
#      It also forces read_data=true.
#   3. Everything else (output_root, solvers toggles, plotting block,
#      external h5 overlays, use_float128) comes from this yml.
#
# Run with:
#   python run.py path/to/this.yml
# (Paths under data/ auto-trigger replot mode. Otherwise add --replot.)
# ===================================================================


base_config: "none"
manual_h5_path: "data/constb/demo/_rawdata/dd72cd.h5"


# ===================================================================
# === Fields that MATTER in manual mode — edit these ===============
# ===================================================================

# Which non-PS solver curves to include in plots. (PS is always plotted.)
solvers:
  rk4: true
  rk45: true
  analytical: true   # recomputed at run time from h5-derived identity

plotting:
  titles: true
  full_plot: true        # true = all diagnostic plots, false = paper plots only
  gyro_plot_slice: 1.5   # gyroperiods in the slice window

output_root: null       # Output destination — data/constb/<yml-stem>/<h5-stem>/...

# External h5 overlays for cross-run PS-order comparison
external_h5:
  root: null
  a:
    enabled: false
    file: null
  b:
    enabled: false
    file: null


# ===================================================================
# === Fields IGNORED in manual mode — keys required, values dead ===
# ===================================================================
# These keys must exist (compute_derived_constb reads them) but their
# values are either overwritten from the h5's params_json or never
# consulted in the cache-load path. LEAVE them as-is.

# --- Identity (overwritten from h5) ---
particle: proton
energy_eV: 1
pitch_deg: 45.0
phi_deg: 45.0
x_initial: 0.0
y_initial: 0.0
z_initial: 0.0
Bfield_si: [0, 0, 0.01]
gyroperiods: 0.0

# --- Float precision (overwritten from h5's params_json["dtype"]) ---
use_float128: false

# --- Bookkeeping (forced or never read in manual mode) ---
read_data: true       # forced True by apply_manual_h5_overrides
write_data: true      # never reached — manual mode skips the solve branch

# --- Solver settings (overwritten from h5) ---
ps_order: 1
rtol_rk45: 1.0e-8
atol_rk45: 1.0e-10

steps_per_gyro:
  ps: 1
  rk4: 1
step_overrides:
  ps: null
  rk4: null
round_decimals: 3
