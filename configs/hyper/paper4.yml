# ===================================================================
# Paper 4 — paper1 physics with larger PS step size (0.63)
# ===================================================================
# PS uses 10x larger step than RK4 to demonstrate PS convergence
# at coarser resolution. Both need overrides since 0.63 isn't the
# default computed value.
# ===================================================================

particle: electron
energy_eV: 10.0e3
pitch_deg: 75.0
phi_deg: 45.0
delta: 500
B_0: 10.0e-9
x_initial_si: 0.0
y_initial_si: 125.0          # 0.25 * delta
z_initial_si: 0.0
gyroperiods: 1.0e5

step_overrides:
  ps: 0.63
  rk4: 0.063

solvers:
  ps: true
  rk4: true
  rk45: true

plotting:
  titles: false
  full_plot: false
  slice_mode: last
  slice_ylim_top: 0.7
  energy_xlim_left: 0.1

read_data: true
write_data: true

use_external_h5: false
use_external_h5b: false
external_h5: null
external_h5b: null
