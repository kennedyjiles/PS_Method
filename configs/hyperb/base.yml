# ===================================================================
# Default configuration for hyperbolic-B simulations
# ===================================================================
# These are the baseline values. A run config only needs to specify
# the values it wants to CHANGE — everything else falls back here.
# Do NOT edit this file directly. Copy it to a new .yml and override
# only the parameters you need.
# ===================================================================


# =====================
# === Run Settings  ===
# =====================

# --- Particle ---
particle: electron          # "proton" or "electron"
energy_eV: 10.0e3           # kinetic energy in eV
pitch_deg: 75.0             # pitch angle (degrees)
phi_deg: 45.0               # gyrophase angle (degrees)

# --- Magnetic field geometry ---
delta: 500                  # current sheet half-thickness (km)
B_0: 10.0e-9                # asymptotic magnetic field strength (T)

# --- Initial position (SI, in km) ---
x_initial_si: 0.0           # initial x position (km)
y_initial_si: 125.0         # initial y position (km); paper1 default = 0.25 * delta
z_initial_si: 0.0           # initial z position (km)

# --- Integration ---
gyroperiods: 100            # number of gyroperiods to simulate

# --- Precision ---
use_float128: false         # true = use np.float128 for extended precision

# --- Solvers ---
solvers:
  ps: true
  rk4: true
  rk45: true

# --- Plotting ---
plotting:
  titles: true              # show plot titles
  full_plot: false           # true = all diagnostic plots, false = paper plots only
  window_gyroperiods: 8     # number of gyroperiods in the trajectory slice window
  slice_mode: last           # "first" or "last" — which end of the simulation to slice
  skip_rk4_slice: false      # true = hide RK4 from 2D slice plot
  slice_ylim: null           # [ymin, ymax] for 2D slice y-axis, or null for auto
  slice_ylim_top: null       # top-only y limit for 2D slice, or null for auto
  slice_equal_aspect: false  # true = set equal aspect on 2D slice
  energy_xlim_left: null     # left x-limit for multi-PS energy plot, or null for auto

# --- Output ---
# By default, output goes to data/hyperb/<config-name>/.
# Set output_root to prepend a path:
#   output_root: "thesis/chapter3"  → thesis/chapter3/data/hyperb/<config-name>/
# Leave null for the default layout.
output_root: null
read_data: true             # scan for cached runs and load from disk
write_data: true            # write trajectory data to h5 file


# ===================================================================
# === Advanced Settings (most users will not need to touch these) ===
# ===================================================================

# --- PS Settings ---
ps_order: 40                # max power series order (system will truncate)

# --- RK45 Tolerances ---
rtol_rk45: 1.0e-12          # RK45 relative tolerance
atol_rk45: 1.0e-14          # RK45 absolute tolerance

# --- Steps per gyroperiod (used to compute step sizes from T_gyro = 2pi) ---
# T_gyro = 2pi in normalized units. step = round(T_gyro / N, round_decimals).
steps_per_gyro:
  ps: 100
  rk4: 100

# --- Step size overrides (optional) ---
# If set, these OVERRIDE the computed step sizes from steps_per_gyro.
# Leave as null to let the code compute them.
step_overrides:
  ps: null
  rk4: null

# --- Step rounding ---
round_decimals: 3           # decimal places for step size rounding

# --- External H5 files (for energy comparison across runs) ---
use_external_h5: false
use_external_h5b: false
external_h5: null
external_h5b: null
external_h5_ps_order: null      # PS order label for external h5 plot legend
external_h5b_ps_order: null     # PS order label for external h5b plot legend
