# ===================================================================
# Demo run — paper1 physics at reduced gyroperiods for quick test
# ===================================================================

use_float128: false         # true = use np.float128 for extended precision


particle: electron
energy_eV: 10.0e3
pitch_deg: 75.0
phi_deg: 45.0
delta: 500
B_0: 10.0e-9
x_initial_si: 0.0
y_initial_si: 125.0          # 0.25 * delta
z_initial_si: 0.0
gyroperiods: 100

solvers:
  ps: true
  rk4: true
  rk45: true

plotting:
  titles: true
  full_plot: false
  slice_mode: last

read_data: true
write_data: true
