# ===================================================================
# Paper 4 — paper1 physics with larger PS step size (0.63)
# ===================================================================
# PS uses 10x larger step than RK4 to demonstrate PS convergence
# at coarser resolution. Both need overrides since 0.63 isn't the
# default computed value.
# ===================================================================
step_overrides:
  ps: 0.63
  rk4: 0.063

solvers:
  rk4: true
  rk45: true

plotting:
  titles: false
  full_plot: true
  slice_ylim_top: 0.7
  energy_xlim_left: 0.1
