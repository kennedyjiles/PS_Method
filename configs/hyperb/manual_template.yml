# ===================================================================
# manual_template.yml — Template for hand-written manual h5 loads
# ===================================================================
# Copy this file (e.g. to data/hyperb/<run>/manual.yml or anywhere
# convenient), point manual_h5_path at the h5 you want to replot,
# and edit the plotting / output fields as needed.
#
# How manual mode works:
#   1. The yml below is loaded with base_config: "none" — nothing is
#      merged from base.yml. Every field the code reads must exist
#      here, even if its value will be ignored.
#   2. hyperb.py opens the h5 at manual_h5_path and OVERWRITES the
#      identity / solver-config fields (energy, pitch, position, B_0,
#      delta, step sizes, ps_order, rk45 tolerances, etc.) from
#      params_json. It also forces read_data=true.
#   3. Everything else (output_root, solvers toggles, plotting block,
#      external h5 overlays, use_float128) comes from this yml.
#
# Run with:
#   python run.py path/to/this.yml
# (Paths under data/ auto-trigger replot mode. Otherwise add --replot.)
# ===================================================================


base_config: "none"
manual_h5_path: "REPLACE_WITH_H5_PATH.h5"


# ===================================================================
# === Fields that MATTER in manual mode — edit these ===============
# ===================================================================

# Which solver curves to include in plots
solvers:
  ps: true
  rk4: true
  rk45: true

plotting:
  titles: true
  full_plot: false
  window_gyroperiods: 8       # gyroperiods in the trajectory slice window
  slice_mode: last            # "first" or "last"
  skip_rk4_slice: false
  slice_ylim: null
  slice_ylim_top: null
  slice_equal_aspect: false
  energy_xlim_left: null

# Output destination — data/hyperb/<yml-stem>/<h5-stem>/...
output_root: null

# External h5 overlays for cross-run PS-order comparison
external_h5:
  root: null
  a:
    enabled: false
    file: null
  b:
    enabled: false
    file: null


# ===================================================================
# === Fields IGNORED in manual mode — keys required, values dead ===
# ===================================================================
# These keys must exist (compute_derived_hyperb reads them) but their
# values are either overwritten from the h5's params_json or never
# consulted in the cache-load path. Leave them as-is.

# --- Identity (overwritten from h5) ---
particle: electron
energy_eV: 10.0e3
pitch_deg: 75.0
phi_deg: 45.0
delta: 500
B_0: 10.0e-9
x_initial_si: 0.0
y_initial_si: 125.0
z_initial_si: 0.0
gyroperiods: 100

# --- Float precision (overwritten from h5's params_json["dtype"]) ---
use_float128: false

# --- Bookkeeping (forced or never read in manual mode) ---
read_data: true       # forced True by apply_manual_h5_overrides
write_data: true      # never reached — manual mode skips the solve branch

# --- Solver settings (overwritten from h5) ---
ps_order: 40
rtol_rk45: 1.0e-12
atol_rk45: 1.0e-14

steps_per_gyro:
  ps: 100
  rk4: 100
step_overrides:
  ps: null
  rk4: null
round_decimals: 3
